name: M3 LLVM24 CPU ORC JNI contract

on:
  push:
    branches: [main, "m3/llvm24-orc-jni-20261118", "m3/llvm24-orc-transfer-ownership-20261118", "m3/llvm24-c-api-fast-preflight-20261118", "m3/llvm24-failed-native-load-latch-20261118"]
    paths:
      - "m3/llvm-orc-jni/**"
      - ".github/workflows/m3-llvm24-orc-jni.yml"
  pull_request:
    branches: [main]
    paths:
      - "m3/llvm-orc-jni/**"
      - ".github/workflows/m3-llvm24-orc-jni.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java21-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            m3/llvm-orc-jni
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify source receipts, JDK21 API and no-native fail-closed behavior
        shell: bash
        run: |
          set -euo pipefail
          bash m3/llvm-orc-jni/scripts/verify-source.sh
          bash m3/llvm-orc-jni/scripts/verify-java.sh
          bash m3/llvm-orc-jni/scripts/verify-wrong-major.sh

  linux-llvm24-native:
    needs: java21-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          fetch-depth: 20
          sparse-checkout: |
            llvm
            cmake
            libc
            third-party
            m3/llvm-orc-jni
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Confirm LLVM 24 source baseline, avoid unqualified runtimes
        shell: bash
        run: |
          set -euo pipefail
          bash m3/llvm-orc-jni/scripts/verify-upstream.sh
          python3 m3/llvm-orc-jni/scripts/verify-ownership.py
          python3 m3/llvm-orc-jni/scripts/verify-builder.py
          grep -Fq 'set(LLVM_VERSION_MAJOR 24)' cmake/Modules/LLVMVersion.cmake
          bash m3/llvm-orc-jni/scripts/verify-source.sh
      - name: Check required original libc CMake source closure before configuring LLVM 24
        shell: bash
        run: |
          set -euo pipefail
          test -d libc || { echo "::error::LLVM24 FindLibcCommonUtils requires the sibling libc/ directory"; exit 1; }
          test -f cmake/Modules/FindLibcCommonUtils.cmake || {
            echo "::error::Original LLVM24 libc CMake module missing"
            exit 1
          }
      - name: Configure original LLVM 24 Core, ORC and host target
        shell: bash
        run: |
          set -euo pipefail
          cmake -S llvm -B build/llvm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=ON \
            -DLLVM_LINK_LLVM_DYLIB=ON
      - name: Check JNI C11 against generated LLVM24 headers before the full native build
        shell: bash
        run: |
          set -euo pipefail
          test -f build/llvm/include/llvm/Config/llvm-config.h
          test -f llvm/include/llvm-c/Core.h
          test -f m3/llvm-orc-jni/src/main/c/m3_llvm_orc_jni.c
          C_COMPILER="$(sed -n 's/^CMAKE_C_COMPILER:FILEPATH=//p' build/llvm/CMakeCache.txt | head -n 1)"
          test -x "$C_COMPILER"
          "$C_COMPILER" -std=c11 -Wall -Wextra -Werror -Werror=deprecated-declarations \
            -fsyntax-only \
            -I "$PWD/build/llvm/include" \
            -I "$PWD/llvm/include" \
            -I "$JAVA_HOME/include" \
            -I "$JAVA_HOME/include/linux" \
            m3/llvm-orc-jni/src/main/c/m3_llvm_orc_jni.c
          echo "M3_LLVM24_JNI_ORIGINAL_C_HEADER_ABI_PREFLIGHT_PASS"
      - name: Compile original LLVM 24 Core, ORC and host target
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/llvm --target LLVM -j 2
      - name: Build additive JNI source with LLVM 24 original libraries
        shell: bash
        run: |
          set -euo pipefail
          cmake -S m3/llvm-orc-jni -B build/m3-llvm-orc-jni -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DM3_LLVM_REQUIRED_MAJOR=24 \
            -DM3_LLVM_ENABLE_FAULT_TEST=ON \
            -DLLVM_DIR="$PWD/build/llvm/lib/cmake/llvm"
          cmake --build build/m3-llvm-orc-jni -j 2
      - name: Execute real LLVM24 ORC and JNI with Java21 overflow/concurrency
        shell: bash
        run: |
          set -euo pipefail
          export M3_LLVM_LIBRARY="$PWD/build/m3-llvm-orc-jni/libm3llvmorcjni.so"
          test -f "$M3_LLVM_LIBRARY"
          bash m3/llvm-orc-jni/scripts/verify.sh
      - name: Prove transferred module ownership with original LLVM24 failure injection
        shell: bash
        run: |
          set -euo pipefail
          export M3_LLVM_LIBRARY="$PWD/build/m3-llvm-orc-jni/libm3llvmorcjni.so"
          export M3_LLVM_TRANSFER_FAULT_LIBRARY="$PWD/build/m3-llvm-orc-jni/libm3llvmtransferfault.so"
          test -f "$M3_LLVM_LIBRARY"
          test -f "$M3_LLVM_TRANSFER_FAULT_LIBRARY"
          bash m3/llvm-orc-jni/scripts/verify-fault.sh
      - name: Retain bounded original LLVM/JNI qualification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m3-llvm24-orc-jni-build-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/llvm/CMakeCache.txt
            build/m3-llvm-orc-jni/CMakeCache.txt
            m3/llvm-orc-jni/build/jni-headers/*
